<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>..::Cuenta::..</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100 ">
        <div class="card p-8 shadow border border-primary" style="width: 100%; max-width: 500px;">
            <h2 class="text-center mb-4">Registrar Nueva Cuenta</h2>
            <!-- El formulario envía los datos mediante POST a la misma URL -->
            <form method="POST" action="{% url 'registrar_cuenta' %}">
                {% csrf_token %}
                                    
                <div class="mb-3">
                    <label class="form-label">Tipo Cuenta (Número):</label>
                    <input  class="form-control" type="number" name="txtTipoCuenta" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" >Descripción:</label>
                    <input class="form-control" type="text" name="txtDescripcion" required>
                </div>

                <div class="mb-3">
                <label class="form-label">Saldo Inicial:</label>
                <input  class="form-control mb-5" type="number" step="0.01" name="txtSaldo" required>
                </div>

                <button type="submit"  class="btn-subtle theme-primary">Guardar cuenta</button>
                
            </form>
        </div>
    </div>
    <hr>




    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Lista de Cuentas</h4>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" class="ps-4">ID</th>
                                <th scope="col">Descripción</th>
                                <th scope="col" class="text-end">Saldo</th>
                                <th scope="col" class="text-center pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for cuenta in cuentas %}
                            <tr>
                                <td class="ps-4">{{ cuenta.id }}</td>
                                <td>{{ cuenta.descripcion }}</td>
                                <td class="text-end text-success fw-bold">{{ cuenta.saldo }}</td>
                                <td class="text-center pe-4">
                                    <a href="{% url 'eliminar_cuenta' cuenta.id %}" 
                                        class="btn-subtle theme-danger"
                                        onclick="return confirm('¿Estás seguro de que deseas eliminar esta cuenta?');">
                                        <i class="bi bi-trash"></i>Eliminar
                                    </a>
                                    <a href="{% url 'actualizar_cuenta' cuenta.id %}"
                                        class="btn-subtle theme-info"><i class="bi bi-pencil-square"></i>Editar
                                    </a>
                                </td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="4" class="text-center text-muted p-4">No hay cuentas registradas.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
